# Steps for the start of a deploy job, before anything uses Modal or Google Cloud. Each one
# stops the job with a message that names the missing or rejected value, before anything
# is deployed. Keep the steps you need.
#
# Where the values come from:
#   MODAL_TOKEN_ID, MODAL_TOKEN_SECRET: GitHub Actions secrets, from a Modal token for the
#     policyengine workspace. Pass them in the job's env, so these checks see exactly what
#     the deploy steps get:
#       env:
#         MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
#         MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
#   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOY_SERVICE_ACCOUNT: GitHub Actions variables.
#     The job also needs `permissions: id-token: write`.

# Modal: run after `pip install modal`.
- name: Modal credentials work
  env:
    MODAL_WORKSPACE: policyengine
  run: |
    missing=""
    test -n "$MODAL_TOKEN_ID" || missing="$missing MODAL_TOKEN_ID"
    test -n "$MODAL_TOKEN_SECRET" || missing="$missing MODAL_TOKEN_SECRET"
    if [ -n "$missing" ]; then
      echo "::error::Empty:$missing. Either the Actions secret is not set (a PolicyEngine organisation admin adds it, from a Modal token for the $MODAL_WORKSPACE workspace) or this job does not pass it in env. Nothing ran on Modal."
      exit 1
    fi
    if ! info=$(modal token info 2>&1); then
      echo "::error::Modal rejected MODAL_TOKEN_ID / MODAL_TOKEN_SECRET: the token is revoked, expired or mistyped. Nothing ran on Modal."
      printf '%s\n' "$info"
      exit 1
    fi
    workspace=$(printf '%s\n' "$info" | sed -n 's/^Workspace: \([^ ]*\).*/\1/p')
    if [ "$workspace" != "$MODAL_WORKSPACE" ]; then
      echo "::error::The Modal token is for workspace '${workspace:-unknown}', not '$MODAL_WORKSPACE'. Nothing ran on Modal."
      exit 1
    fi
    echo "Modal token works for workspace $workspace"

# Google Cloud: replace PROJECT and REGION.
- name: Google Cloud settings present
  env:
    GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
    GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
  run: |
    missing=""
    test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" || missing="$missing GCP_WORKLOAD_IDENTITY_PROVIDER"
    test -n "$GCP_DEPLOY_SERVICE_ACCOUNT" || missing="$missing GCP_DEPLOY_SERVICE_ACCOUNT"
    if [ -n "$missing" ]; then
      echo "::error::Missing Actions variable(s):$missing. Add them under Settings, Secrets and variables, Actions, Variables. Nothing was deployed."
      exit 1
    fi

- uses: google-github-actions/auth@v3
  with:
    workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
    service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

- uses: google-github-actions/setup-gcloud@v3

- name: Google Cloud access works
  env:
    PROJECT_ID: PROJECT
    REGION: REGION
    GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
  run: |
    # The braces keep gcloud's normal output out of $error, so nothing it prints is captured.
    if ! error=$( { gcloud run services list --project "$PROJECT_ID" --region "$REGION" --limit 1 >/dev/null; } 2>&1 ); then
      echo "::error::$GCP_DEPLOY_SERVICE_ACCOUNT cannot list Cloud Run services in $PROJECT_ID ($REGION). Check this repository's workload identity binding and the account's roles. Nothing was deployed."
      printf '%s\n' "$error"
      exit 1
    fi
    echo "$GCP_DEPLOY_SERVICE_ACCOUNT can reach Cloud Run in $PROJECT_ID ($REGION)"
